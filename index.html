<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A cinematic, interactive Valentine proposal experience. Will you be my valentine?" />
  <title>Will You Be My Valentine?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background particle canvas -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- ============================================ -->
  <!-- PROPOSAL CARD                                -->
  <!-- ============================================ -->
  <main id="proposal-screen" class="screen" role="main">
    <article id="proposal-card" class="glass-card">
      <h1 id="proposal-heading" class="heading">
        Will you be my valentine?
      </h1>
      <p id="proposal-subtext" class="subtext">
        This is a one-time, non-refundable, emotionally binding question.
      </p>
      <div id="button-row" class="button-row">
        <button id="btn-yes" class="btn btn-yes" type="button">
          Yes <span aria-hidden="true">💖</span>
        </button>
        <button id="btn-no" class="btn btn-no" type="button">
          No
        </button>
      </div>
    </article>
  </main>

  <!-- ============================================ -->
  <!-- SUCCESS SCREEN                               -->
  <!-- ============================================ -->
  <section id="success-screen" class="screen hidden" aria-live="polite">
    <canvas id="heart-canvas" aria-hidden="true"></canvas>
    <article id="success-card" class="glass-card success-card">
      <h1 id="success-heading" class="heading success-heading">
        Access Granted: Valentine Confirmed <span aria-hidden="true">💖</span>
      </h1>
      <p id="success-subtext" class="subtext success-subtext">
        Connection established. Estimated duration: forever.
      </p>
    </article>
  </section>

  <script src="script.js"></script>
</body>
</html>
