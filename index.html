<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A cinematic, interactive Valentine proposal experience. Will you be my valentine? 💕" />
  <title>💌 Will You Be My Valentine?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background particle canvas -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- Ambient floating orbs -->
  <div id="orbs" class="orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Theme toggle -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme 🌓">
    <span class="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <!-- ============================================ -->
  <!-- PROPOSAL CARD                                -->
  <!-- ============================================ -->
  <main id="proposal-screen" class="screen" role="main">
    <article id="proposal-card" class="glass-card card-entrance">
      <!-- Decorative sparkle -->
      <div class="card-sparkle" aria-hidden="true">✨</div>

      <h1 id="proposal-heading" class="heading">
        Will you be my valentine? 💗
      </h1>
      <p id="proposal-subtext" class="subtext">
        This is a one-time, non-refundable, emotionally binding question. 📜
      </p>

      <!-- Mood indicator — updates as No is clicked -->
      <div id="mood-indicator" class="mood-indicator" aria-live="polite" aria-label="Current mood">
        <span id="mood-emoji" class="mood-emoji">🥰</span>
      </div>

      <div id="button-row" class="button-row">
        <button id="btn-yes" class="btn btn-yes" type="button">
          Yes <span aria-hidden="true">💖</span>
        </button>
        <button id="btn-no" class="btn btn-no" type="button">
          No 🙅
        </button>
      </div>

      <!-- Progress dots showing No click stages -->
      <div id="stage-dots" class="stage-dots" aria-label="Rejection stages">
        <span class="dot" data-stage="0"></span>
        <span class="dot" data-stage="1"></span>
        <span class="dot" data-stage="2"></span>
        <span class="dot" data-stage="3"></span>
        <span class="dot" data-stage="4"></span>
        <span class="dot" data-stage="5"></span>
      </div>
    </article>
  </main>

  <!-- ============================================ -->
  <!-- SUCCESS SCREEN                               -->
  <!-- ============================================ -->
  <section id="success-screen" class="screen hidden" aria-live="polite">
    <canvas id="heart-canvas" aria-hidden="true"></canvas>
    <article id="success-card" class="glass-card success-card">
      <div class="success-badge" aria-hidden="true">🎉</div>
      <h1 id="success-heading" class="heading success-heading">
        Access Granted: Valentine Confirmed 💖
      </h1>
      <p id="success-subtext" class="subtext success-subtext">
        Connection established. Estimated duration: forever. 💫
      </p>
      <div class="success-footer">
        <span class="success-stamp" aria-hidden="true">━━ 💌 ━━</span>
      </div>
    </article>
  </section>

  <script src="script.js"></script>
</body>
</html>
